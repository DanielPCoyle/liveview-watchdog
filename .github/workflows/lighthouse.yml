name: Lighthouse

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Page quality budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build

      # Median of three runs. A single Lighthouse run on shared CI hardware
      # swings widely — measured 74 to 94 on one machine for an unchanged page —
      # so a lone sample would gate on the runner's mood rather than the code.
      - name: Assert budgets (>= 90 across the board)
        run: bunx --bun @lhci/cli@0.15.x autorun

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
