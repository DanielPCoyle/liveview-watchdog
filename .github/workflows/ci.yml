name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Strict mode with noUnusedLocals — this is the gate that catches state
      # left dangling when a feature is removed.
      - name: Typecheck
        run: bun run typecheck

      # Coverage floors are enforced in bunfig.toml (85% lines and functions);
      # this step fails if the suite drops below them.
      - name: Tests + coverage
        run: bun test src

      - name: Build
        run: bun run build
